<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Centenary Client Portal</title>
<link rel="icon" href="assets/centenary-favicon.png" type="image/png">
<link rel="stylesheet" href="css/sspr.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img class="brand-logo" src="assets/centenary-logo.png" alt="Centenary Networks">
    <h1>Centenary Client Portal</h1>
    <p class="login-subtitle">Request your administrator password reset</p>

    <div id="alertBox" class="alert" role="status" aria-live="polite"></div>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@yourcompany.com" autocomplete="email" required>
        <div class="field-error" id="emailError">Please enter a valid email address.</div>
      </div>

      <button class="btn" type="submit" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span id="submitBtnText">Send Reset Link</span>
      </button>
    </form>

    <a class="back-link" href="/">&larr; Back to login</a>
  </div>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('forgotForm');
  var emailInput = document.getElementById('email');
  var emailError = document.getElementById('emailError');
  var alertBox = document.getElementById('alertBox');
  var submitBtn = document.getElementById('submitBtn');
  var submitBtnText = document.getElementById('submitBtnText');

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function isValidEmail(value) {
    return EMAIL_RE.test(value.trim());
  }

  function showAlert(type, message) {
    alertBox.className = 'alert show alert-' + type;
    alertBox.textContent = message;
  }

  function hideAlert() {
    alertBox.className = 'alert';
    alertBox.textContent = '';
  }

  function setFieldInvalid(invalid) {
    emailInput.classList.toggle('invalid', invalid);
    emailError.classList.toggle('show', invalid);
  }

  // Real-time client-side email validation.
  emailInput.addEventListener('input', function () {
    if (emailInput.value.trim() === '') {
      setFieldInvalid(false);
      return;
    }
    setFieldInvalid(!isValidEmail(emailInput.value));
  });

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.classList.toggle('is-loading', isLoading);
    submitBtnText.textContent = isLoading ? 'Processing...' : 'Send Reset Link';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideAlert();

    var email = emailInput.value.trim();
    if (!isValidEmail(email)) {
      setFieldInvalid(true);
      emailInput.focus();
      return;
    }
    setFieldInvalid(false);
    setLoading(true);

    fetch('api-request-reset.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        setLoading(false);
        if (data && data.status === 'success') {
          showAlert('success', data.message || 'If that email exists, a reset link has been sent.');
          form.reset();
        } else {
          showAlert('error', (data && data.message) || 'Something went wrong. Please try again.');
        }
      })
      .catch(function () {
        setLoading(false);
        showAlert('error', 'Unable to reach the server. Please check your connection and try again.');
      });
  });
})();
</script>

</body>
</html>
